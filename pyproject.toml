[project]
name = "all-in-one-rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "bs4>=0.0.2",
    "chonkie[semantic]>=1.6.8",
    "dotenv>=0.9.9",
    "faster-whisper>=1.2.1",
    "google-genai>=2.10.0",
    "google-generativeai>=0.8.6",
    "markdown>=3.10.2",
    "openai>=2.44.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "pypdf>=6.14.2",
    "sentence-transformers>=5.6.0",
    "weaviate-client>=4.22.0",
]

[tool.pyright]
extraPaths = ["src/all-in-one-rag"]

[tool.basedpyright]
extraPaths = ["src/all-in-one-rag"]

[tool.pytest.ini_options]
pythonpath = ["src/all-in-one-rag"]

